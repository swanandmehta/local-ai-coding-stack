name: local-llm-coding

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    gpus: all
    cpus: 12
    mem_limit: 24g
    ports:
      - "11434:11434"
    environment:
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_CONTEXT_LENGTH: 20480
      OLLAMA_FLASH_ATTENTION: "1"
    volumes:
      - ./ollama/models:/root/.ollama
    healthcheck:
      test:
        - CMD
        - /bin/sh
        - -c
        - "OLLAMA_HOST=localhost:11434 ollama list >/dev/null 2>&1"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s